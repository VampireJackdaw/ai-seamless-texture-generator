[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-seamless-texture-generator"
version = "0.6.2"
description = "AI-driven seamless pattern and tileable texture generator for Windows desktops."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "texturegen contributors" }]
keywords = ["texture", "seamless", "tileable", "generative", "pattern", "diffusion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "pillow>=10.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
torch = ["torch>=2.3", "torchvision>=0.18"]
onnx = ["onnxruntime>=1.17"]
native = ["pybind11>=2.12"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
    "pre-commit>=3.7",
]

[project.scripts]
texturegen = "texturegen.cli:app"

[project.urls]
Homepage = "https://github.com/yourname/ai-seamless-texture-generator"
Issues = "https://github.com/yourname/ai-seamless-texture-generator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["texturegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=texturegen --cov-report=term-missing"