version: 1
disable_existing_loggers: false
formatters:
  standard:
    format: "%(asctime)s %(levelname)s %(name)s :: %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    level: INFO
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    filename: texturegen.log
    maxBytes: 5242880
    backupCount: 3
    level: DEBUG
loggers:
  texturegen:
    level: DEBUG
    handlers: [console, file]
    propagate: false
root:
  level: WARNING
  handlers: [console]